name: Build BPM2Hz Plugin

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS (VST3 & AU)
    runs-on: macos-14 # Runner Apple Silicon nativo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build Plugin
        run: |
          cmake --build build --config Release -j$(sysctl -n hw.ncpu)

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BPM2Hz-macOS-Plugins
          path: |
            build/BPM2Hz_artefacts/Release/VST3/BPM2Hz.vst3
            build/BPM2Hz_artefacts/Release/AU/BPM2Hz.component